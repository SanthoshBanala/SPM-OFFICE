<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC ODS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: #fff;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header h1 { font-size: 1.5rem; font-weight: 600; }
        .header p { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }
        .header-actions {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .btn-force-reload {
            background: #ff6d00;
            color: #fff;
            border: none;
            padding: 9px 22px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            animation: pulse-btn 2s infinite;
        }
        .btn-force-reload:hover { background: #e65100; }
        @keyframes pulse-btn {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,109,0,0.5); }
            50% { box-shadow: 0 0 0 8px rgba(255,109,0,0); }
        }
        .last-updated {
            font-size: 0.8rem;
            opacity: 0.9;
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .auto-refresh-info {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        /* Tab Bar */
        .tab-bar {
            max-width: 1200px;
            margin: 20px auto 0;
            padding: 0 20px;
            display: flex;
            gap: 0;
            border-bottom: 3px solid #1a237e;
        }
        .tab-btn {
            padding: 12px 28px;
            border: 2px solid transparent;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            background: #e0e3f0;
            color: #555;
            transition: all 0.2s;
            position: relative;
            bottom: -3px;
        }
        .tab-btn:hover { background: #cdd2e8; color: #333; }
        .tab-btn.active {
            background: #fff;
            color: #1a237e;
            border-color: #1a237e;
            border-bottom: 3px solid #fff;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .controls {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls label {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .controls input[type="date"] {
            padding: 8px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .btn {
            padding: 9px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #1a237e; color: #fff; }
        .btn-primary:hover { background: #283593; }
        .btn-copy { background: #2e7d32; color: #fff; font-size: 0.8rem; padding: 6px 14px; }
        .btn-copy:hover { background: #388e3c; }
        .btn-copy-all { background: #e65100; color: #fff; }
        .btn-copy-all:hover { background: #f57c00; }
        .btn-whatsapp { background: #25D366; color: #fff; font-size: 0.8rem; padding: 6px 14px; }
        .btn-whatsapp:hover { background: #1ebe57; }

        .status {
            max-width: 1200px;
            margin: 10px auto;
            padding: 0 20px;
            font-size: 0.85rem;
            color: #666;
        }
        .status.error { color: #c62828; font-weight: 600; }
        .status.success { color: #2e7d32; font-weight: 600; }

        .summary {
            max-width: 1200px;
            margin: 10px auto;
            padding: 10px 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .summary-card {
            background: #fff;
            border-radius: 8px;
            padding: 10px 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .summary-card .count {
            background: #1a237e;
            color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .messages-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            border-left: 5px solid #1a237e;
        }
        .message-card.cele-card { border-left-color: #00695c; }
        .message-card.dead-card { border-left-color: #b71c1c; }
        .message-card-header {
            background: #e8eaf6;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .cele-card .message-card-header { background: #e0f2f1; }
        .dead-card .message-card-header { background: #fce4ec; }
        .message-card-header h2 { font-size: 1.1rem; color: #1a237e; }
        .cele-card .message-card-header h2 { color: #00695c; }
        .dead-card .message-card-header h2 { color: #b71c1c; }
        .message-card-header .badge {
            background: #1a237e;
            color: #fff;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .cele-card .message-card-header .badge { background: #00695c; }
        .dead-card .message-card-header .badge { background: #b71c1c; }
        .message-card-body { padding: 20px; }
        .message-text {
            white-space: pre-wrap;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #333;
        }
        .card-actions { display: flex; gap: 8px; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        .loading { text-align: center; padding: 60px 20px; color: #888; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #1a237e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .no-foreign { text-align: center; padding: 40px; color: #888; font-style: italic; }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.2rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .message-card-header { flex-direction: column; align-items: flex-start; }
            .tab-btn { padding: 10px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>AC ODS — SWR Locomotive Messages</h1>
    <p>Generate formatted messages for each Railway</p>
    <div class="header-actions">
        <button class="btn-force-reload" onclick="forceReloadAll()" title="Bypass cache and fetch fresh data">🔄 Force Reload All</button>
        <span class="last-updated" id="lastUpdated">Not yet loaded</span>
        <span class="auto-refresh-info" id="autoRefreshInfo">Auto-refresh: every 5 min</span>
    </div>
</div>

<!-- Tab Navigation -->
<div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('ods')">🚂 Dy.CEE/TRS (ODS)</button>
    <button class="tab-btn" onclick="switchTab('cele')">⚡ CELE (Coaching Locos)</button>
    <button class="tab-btn" onclick="switchTab('dead')">🔧 DEAD/Repair</button>
</div>

<!-- ==================== TAB 1: ODS ==================== -->
<div id="tab-ods" class="tab-pane active">
    <div class="controls">
        <label for="msgDate">Date:</label>
        <input type="date" id="msgDate">
        <button class="btn btn-primary" onclick="fetchODS()">🔄 Refresh Data</button>
        <button class="btn btn-copy-all" onclick="copyAllODS()">📋 Copy All Messages</button>
    </div>
    <div class="status" id="odsStatus"></div>
    <div class="summary" id="odsSummary"></div>
    <div class="messages-container" id="odsMessages">
        <div class="no-foreign">Click "Refresh Data" to load ODS messages.</div>
    </div>
</div>

<!-- ==================== TAB 2: CELE ==================== -->
<div id="tab-cele" class="tab-pane">
    <div class="controls">
        <label for="celeMsgDate">Date:</label>
        <input type="date" id="celeMsgDate">
        <button class="btn btn-primary" style="background:#00695c;" onclick="fetchCELE()">🔄 Refresh Data</button>
        <button class="btn btn-copy-all" onclick="copyAllCELE()">📋 Copy All Messages</button>
    </div>
    <div class="status" id="celestatus"></div>
    <div class="summary" id="celeSummary"></div>
    <div class="messages-container" id="celeMessages">
        <div class="no-foreign">Click "Refresh Data" to load CELE messages.</div>
    </div>
</div>

<!-- ==================== TAB 3: DEAD/Repair ==================== -->
<div id="tab-dead" class="tab-pane">
    <div class="controls">
        <label for="deadMsgDate">Date:</label>
        <input type="date" id="deadMsgDate">
        <button class="btn btn-primary" style="background:#b71c1c;" onclick="fetchDEAD()">🔄 Refresh Data</button>
        <button class="btn btn-copy-all" onclick="copyAllDEAD()">📋 Copy All Messages</button>
    </div>
    <div class="status" id="deadStatus"></div>
    <div class="summary" id="deadSummary"></div>
    <div class="messages-container" id="deadMessages">
        <div class="no-foreign">Click "Refresh Data" to load DEAD/Repair messages.</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== URLs =====
const ODS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLBxuI5EuzfNDVaRGEydHmZGnehw8srYo6FlGllLAwft3bGo9ch6WzwEf6boKQUwhPGxJNz9y6tA6K/pub?gid=1067378525&single=true&output=csv';
const CELE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLBxuI5EuzfNDVaRGEydHmZGnehw8srYo6FlGllLAwft3bGo9ch6WzwEf6boKQUwhPGxJNz9y6tA6K/pub?gid=489788946&single=true&output=csv';
const DEAD_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLBxuI5EuzfNDVaRGEydHmZGnehw8srYo6FlGllLAwft3bGo9ch6WzwEf6boKQUwhPGxJNz9y6tA6K/pub?gid=1657105856&single=true&output=csv';

const SENDER_RLY = 'SWR';
let odsFormattedMessages = {};
let celeFormattedMessages = {};
let deadFormattedMessages = {};

// ===== Tab Switching =====
function switchTab(tab) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    const btns = document.querySelectorAll('.tab-btn');
    const tabIndex = { ods: 0, cele: 1, dead: 2 };
    btns[tabIndex[tab]].classList.add('active');
}

// ===== Shared Utilities =====
function parseCSV(text) {
    const rows = [];
    let current = '';
    let inQuotes = false;
    const lines = text.split('\n');
    for (const line of lines) {
        if (inQuotes) {
            current += '\n' + line;
            if ((line.match(/"/g) || []).length % 2 === 1) { inQuotes = false; rows.push(current); current = ''; }
        } else {
            if ((line.match(/"/g) || []).length % 2 === 1) { inQuotes = true; current = line; }
            else rows.push(line);
        }
    }
    if (current) rows.push(current);
    return rows.map(row => {
        const cols = []; let field = ''; let q = false;
        for (let i = 0; i < row.length; i++) {
            const c = row[i];
            if (q) {
                if (c === '"' && row[i+1] === '"') { field += '"'; i++; }
                else if (c === '"') q = false;
                else field += c;
            } else {
                if (c === '"') q = true;
                else if (c === ',') { cols.push(field.trim()); field = ''; }
                else field += c;
            }
        }
        cols.push(field.trim());
        return cols;
    });
}

function formatDate(dateInput) {
    const d = new Date(dateInput);
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ Copied to clipboard!')).catch(() => {
        const ta = document.createElement('textarea'); ta.value = text;
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta); showToast('✅ Copied to clipboard!');
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
}

async function fetchCSVWithFallback(csvUrl) {
    // Cache-busting: append unique timestamp to bypass browser/CDN cache
    const cacheBuster = '_cb=' + Date.now();
    const bustUrl = csvUrl + (csvUrl.includes('?') ? '&' : '?') + cacheBuster;
    const methods = [
        { name: 'Direct', url: bustUrl },
        { name: 'Proxy 1', url: 'https://corsproxy.io/?' + encodeURIComponent(bustUrl) },
        { name: 'Proxy 2', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(bustUrl) },
    ];
    for (const method of methods) {
        try {
            const response = await fetch(method.url, { cache: 'no-store' });
            if (!response.ok) continue;
            const text = await response.text();
            if (text && text.length > 50 && text.includes(',')) { console.log(`Loaded via ${method.name}`); return text; }
        } catch (e) { console.warn(`${method.name} failed:`, e.message); }
    }
    throw new Error('All fetch methods failed. Check internet or use a local web server.');
}

// ===== TAB 1: ODS (Dy.CEE/TRS) =====
function buildODSMessages(rows, dateStr) {
    const grouped = {};
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (row.length < 12) continue;
        const zone = (row[10] || '').trim().toUpperCase();
        const message = (row[11] || '').trim();
        if (!zone || zone === SENDER_RLY || zone === 'ZONE') continue;
        if (!message) continue;
        if (!grouped[zone]) grouped[zone] = [];
        grouped[zone].push(message);
    }
    const result = {};
    for (const zone of Object.keys(grouped).sort()) {
        const msgs = grouped[zone];
        const numberedLines = msgs.map((m, idx) => {
            let cleanMsg = m.startsWith(')') ? m.substring(1).trim() : m;
            return `${idx + 1}) ${cleanMsg}`;
        });
        result[zone] = {
            text: `Date: ${dateStr}\n\nFrom,\nDy. CEE/TRS/${SENDER_RLY}\n\nTo,\nDy. CEE/TRS/${zone}\n\n${numberedLines.join('\n')}\n\nKindly arrange for the movement of the above locomotives — those due for IA/IB schedules to the nearest Loco Shed, and those due for IC schedule to their respective Home Shed. Otherwise, SWR will not be responsible for any locomotive failure or unusual occurrence.\n\nRegards,\nDy. CEE/TRS/${SENDER_RLY}`,
            count: msgs.length
        };
    }
    return result;
}

function renderODS(messages) {
    const container = document.getElementById('odsMessages');
    const summaryDiv = document.getElementById('odsSummary');
    const zones = Object.keys(messages).sort();
    if (zones.length === 0) { container.innerHTML = '<div class="no-foreign">No foreign railway locos found.</div>'; summaryDiv.innerHTML = ''; return; }
    const totalLocos = zones.reduce((sum, z) => sum + messages[z].count, 0);
    summaryDiv.innerHTML = `
        <div class="summary-card"><div class="count">${zones.length}</div><span>Railways</span></div>
        <div class="summary-card"><div class="count" style="width:auto;padding:0 8px;border-radius:12px;">${totalLocos}</div><span>Total Locos</span></div>`;
    container.innerHTML = zones.map(zone => `
        <div class="message-card" id="ods-card-${zone}">
            <div class="message-card-header">
                <div style="display:flex;align-items:center;gap:10px;">
                    <h2>📨 ${zone}</h2>
                    <span class="badge">${messages[zone].count} loco${messages[zone].count > 1 ? 's' : ''}</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-copy" onclick="copyToClipboard(odsFormattedMessages['${zone}'].text)">📋 Copy</button>
                    <button class="btn btn-whatsapp" onclick="window.open('https://wa.me/?text='+encodeURIComponent(odsFormattedMessages['${zone}'].text),'_blank')">💬 WhatsApp</button>
                </div>
            </div>
            <div class="message-card-body"><div class="message-text">${escapeHtml(messages[zone].text)}</div></div>
        </div>`).join('');
}

function copyAllODS() {
    const zones = Object.keys(odsFormattedMessages).sort();
    if (!zones.length) { showToast('⚠️ No messages. Refresh first.'); return; }
    copyToClipboard(zones.map(z => `${'═'.repeat(50)}\n  MESSAGE FOR ${z}\n${'═'.repeat(50)}\n\n${odsFormattedMessages[z].text}`).join('\n\n\n'));
}

async function fetchODS() {
    const container = document.getElementById('odsMessages');
    const statusDiv = document.getElementById('odsStatus');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching ODS data...</div>';
    statusDiv.textContent = ''; statusDiv.className = 'status';
    try {
        const csvText = await fetchCSVWithFallback(ODS_CSV_URL);
        const rows = parseCSV(csvText);
        const dateStr = formatDate(document.getElementById('msgDate').value);
        odsFormattedMessages = buildODSMessages(rows, dateStr);
        renderODS(odsFormattedMessages);
        const zones = Object.keys(odsFormattedMessages);
        statusDiv.textContent = `✅ Loaded ${rows.length} rows. Messages for ${zones.length} railways.`;
        statusDiv.className = 'status success';
    } catch (err) {
        container.innerHTML = `<div class="no-foreign">❌ Error: ${err.message}</div>`;
        statusDiv.textContent = `Error: ${err.message}`; statusDiv.className = 'status error';
    }
}

// ===== TAB 2: CELE (Coaching Locos) =====
function buildCELEMessages(rows, dateStr) {
    // Section D: "SWR AC Coaching Locos working in FR/SPL Trains/Link"
    // Column M (index 12) has the message, last word after "/" is the railway
    const grouped = {};
    let inSectionD = false;

    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const firstCol = (row[0] || '').trim();

        // Detect section D start
        if (firstCol.startsWith('D)')) { inSectionD = true; continue; }
        // Detect section E or later — stop
        if (firstCol.startsWith('E)') || firstCol.startsWith('F)')) { inSectionD = false; continue; }

        if (!inSectionD) continue;
        if (row.length < 13) continue;

        const message = (row[12] || '').trim();
        if (!message || message.startsWith('SL') || message === '') continue;

        // Extract railway: last word after last "/"
        const parts = message.split('/');
        let rly = (parts[parts.length - 1] || '').trim().toUpperCase();
        rly = rly.replace(/[,\s]+$/, '');
        if (!rly || rly === SENDER_RLY || rly.length > 10) continue;

        if (!grouped[rly]) grouped[rly] = [];
        grouped[rly].push(message);
    }

    const result = {};
    for (const rly of Object.keys(grouped).sort()) {
        const msgs = grouped[rly];
        const numberedLines = msgs.map((m, idx) => {
            let cleanMsg = m.startsWith(')') ? m.substring(1).trim() : m;
            return `${idx + 1}) ${cleanMsg}`;
        });
        result[rly] = {
            text: `Date: ${dateStr}\n\nFrom,\nCELE/${SENDER_RLY}\n\nTo,\nCELE/${rly}\n\n${numberedLines.join('\n')}\n\n     After arrival, kindly induct this loco in HOG links of SWR trains.\n\nRegards,\nCELE/${SENDER_RLY}`,
            count: msgs.length
        };
    }
    return result;
}

function renderCELE(messages) {
    const container = document.getElementById('celeMessages');
    const summaryDiv = document.getElementById('celeSummary');
    const zones = Object.keys(messages).sort();
    if (zones.length === 0) { container.innerHTML = '<div class="no-foreign">No CELE coaching loco messages found.</div>'; summaryDiv.innerHTML = ''; return; }
    const totalLocos = zones.reduce((sum, z) => sum + messages[z].count, 0);
    summaryDiv.innerHTML = `
        <div class="summary-card"><div class="count" style="background:#00695c;">${zones.length}</div><span>Railways</span></div>
        <div class="summary-card"><div class="count" style="width:auto;padding:0 8px;border-radius:12px;background:#00695c;">${totalLocos}</div><span>Total Locos</span></div>`;
    container.innerHTML = zones.map(zone => `
        <div class="message-card cele-card" id="cele-card-${zone}">
            <div class="message-card-header">
                <div style="display:flex;align-items:center;gap:10px;">
                    <h2>⚡ ${zone}</h2>
                    <span class="badge">${messages[zone].count} loco${messages[zone].count > 1 ? 's' : ''}</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-copy" onclick="copyToClipboard(celeFormattedMessages['${zone}'].text)">📋 Copy</button>
                    <button class="btn btn-whatsapp" onclick="window.open('https://wa.me/?text='+encodeURIComponent(celeFormattedMessages['${zone}'].text),'_blank')">💬 WhatsApp</button>
                </div>
            </div>
            <div class="message-card-body"><div class="message-text">${escapeHtml(messages[zone].text)}</div></div>
        </div>`).join('');
}

function copyAllCELE() {
    const zones = Object.keys(celeFormattedMessages).sort();
    if (!zones.length) { showToast('⚠️ No messages. Refresh first.'); return; }
    copyToClipboard(zones.map(z => `${'═'.repeat(50)}\n  MESSAGE FOR ${z}\n${'═'.repeat(50)}\n\n${celeFormattedMessages[z].text}`).join('\n\n\n'));
}

async function fetchCELE() {
    const container = document.getElementById('celeMessages');
    const statusDiv = document.getElementById('celestatus');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching CELE data...</div>';
    statusDiv.textContent = ''; statusDiv.className = 'status';
    try {
        const csvText = await fetchCSVWithFallback(CELE_CSV_URL);
        const rows = parseCSV(csvText);
        const dateStr = formatDate(document.getElementById('celeMsgDate').value);
        celeFormattedMessages = buildCELEMessages(rows, dateStr);
        renderCELE(celeFormattedMessages);
        const zones = Object.keys(celeFormattedMessages);
        statusDiv.textContent = `✅ Loaded ${rows.length} rows. Messages for ${zones.length} railways.`;
        statusDiv.className = 'status success';
    } catch (err) {
        container.innerHTML = `<div class="no-foreign">❌ Error: ${err.message}</div>`;
        statusDiv.textContent = `Error: ${err.message}`; statusDiv.className = 'status error';
    }
}

// ===== TAB 3: DEAD/Repair =====
function buildDEADMessages(rows, dateStr) {
    // Column S (index 18) = message, Column T (index 19) = railway
    // Section A only (SWR dead locos on foreign railways)
    const grouped = {};
    let inSectionA = true;

    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const firstCol = (row[0] || '').trim();

        // Detect section B — stop processing
        if (firstCol.startsWith('B)')) { inSectionA = false; continue; }
        if (!inSectionA) continue;
        if (row.length < 20) continue;

        const message = (row[18] || '').trim();
        let rly = (row[19] || '').trim().toUpperCase();
        rly = rly.replace(/[,\s]+$/, '');

        if (!message || message.startsWith(')') === false) continue;
        if (!rly || rly === SENDER_RLY || rly === '' || rly.length > 10) continue;

        if (!grouped[rly]) grouped[rly] = [];
        grouped[rly].push(message);
    }

    const result = {};
    for (const rly of Object.keys(grouped).sort()) {
        const msgs = grouped[rly];
        const numberedLines = msgs.map((m, idx) => {
            let cleanMsg = m.startsWith(')') ? m.substring(1).trim() : m;
            return `${idx + 1}) ${cleanMsg}`;
        });
        result[rly] = {
            text: `Date: ${dateStr}\n\nFrom,\nDy. CEE/TRS/${SENDER_RLY}\n\nTo,\nDy. CEE/TRS/${rly}\n\n${numberedLines.join('\n')}\n\nKindly Arrange to Move the Loco to Nearest Shed or Home Shed for Attention.\n\nRegards,\nDy. CEE/TRS/${SENDER_RLY}`,
            count: msgs.length
        };
    }
    return result;
}

function renderDEAD(messages) {
    const container = document.getElementById('deadMessages');
    const summaryDiv = document.getElementById('deadSummary');
    const zones = Object.keys(messages).sort();
    if (zones.length === 0) { container.innerHTML = '<div class="no-foreign">No DEAD/Repair loco messages found.</div>'; summaryDiv.innerHTML = ''; return; }
    const totalLocos = zones.reduce((sum, z) => sum + messages[z].count, 0);
    summaryDiv.innerHTML = `
        <div class="summary-card"><div class="count" style="background:#b71c1c;">${zones.length}</div><span>Railways</span></div>
        <div class="summary-card"><div class="count" style="width:auto;padding:0 8px;border-radius:12px;background:#b71c1c;">${totalLocos}</div><span>Total Locos</span></div>`;
    container.innerHTML = zones.map(zone => `
        <div class="message-card dead-card" id="dead-card-${zone}">
            <div class="message-card-header">
                <div style="display:flex;align-items:center;gap:10px;">
                    <h2>🔧 ${zone}</h2>
                    <span class="badge">${messages[zone].count} loco${messages[zone].count > 1 ? 's' : ''}</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-copy" onclick="copyToClipboard(deadFormattedMessages['${zone}'].text)">📋 Copy</button>
                    <button class="btn btn-whatsapp" onclick="window.open('https://wa.me/?text='+encodeURIComponent(deadFormattedMessages['${zone}'].text),'_blank')">💬 WhatsApp</button>
                </div>
            </div>
            <div class="message-card-body"><div class="message-text">${escapeHtml(messages[zone].text)}</div></div>
        </div>`).join('');
}

function copyAllDEAD() {
    const zones = Object.keys(deadFormattedMessages).sort();
    if (!zones.length) { showToast('⚠️ No messages. Refresh first.'); return; }
    copyToClipboard(zones.map(z => `${'═'.repeat(50)}\n  MESSAGE FOR ${z}\n${'═'.repeat(50)}\n\n${deadFormattedMessages[z].text}`).join('\n\n\n'));
}

async function fetchDEAD() {
    const container = document.getElementById('deadMessages');
    const statusDiv = document.getElementById('deadStatus');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching DEAD/Repair data...</div>';
    statusDiv.textContent = ''; statusDiv.className = 'status';
    try {
        const csvText = await fetchCSVWithFallback(DEAD_CSV_URL);
        const rows = parseCSV(csvText);
        const dateStr = formatDate(document.getElementById('deadMsgDate').value);
        deadFormattedMessages = buildDEADMessages(rows, dateStr);
        renderDEAD(deadFormattedMessages);
        const zones = Object.keys(deadFormattedMessages);
        statusDiv.textContent = `✅ Loaded ${rows.length} rows. Messages for ${zones.length} railways.`;
        statusDiv.className = 'status success';
    } catch (err) {
        container.innerHTML = `<div class="no-foreign">❌ Error: ${err.message}</div>`;
        statusDiv.textContent = `Error: ${err.message}`; statusDiv.className = 'status error';
    }
}

// ===== Force Reload All =====
function updateLastUpdatedTime() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('lastUpdated').textContent = '✅ Last updated: ' + timeStr;
}

async function forceReloadAll() {
    showToast('🔄 Force reloading all data...');
    await Promise.all([fetchODS(), fetchCELE(), fetchDEAD()]);
    updateLastUpdatedTime();
    showToast('✅ All data reloaded!');
}

// ===== Auto-refresh every 5 minutes =====
let autoRefreshInterval = null;
function startAutoRefresh() {
    const INTERVAL_MS = 5 * 60 * 1000; // 5 minutes
    if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    autoRefreshInterval = setInterval(async () => {
        console.log('Auto-refreshing data...');
        await Promise.all([fetchODS(), fetchCELE(), fetchDEAD()]);
        updateLastUpdatedTime();
        document.getElementById('autoRefreshInfo').textContent = 'Auto-refresh: every 5 min';
    }, INTERVAL_MS);
}

// ===== Auto-load all on page open =====
document.addEventListener('DOMContentLoaded', async () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('msgDate').value = today;
    document.getElementById('celeMsgDate').value = today;
    document.getElementById('deadMsgDate').value = today;
    await Promise.all([fetchODS(), fetchCELE(), fetchDEAD()]);
    updateLastUpdatedTime();
    startAutoRefresh();
});
</script>
